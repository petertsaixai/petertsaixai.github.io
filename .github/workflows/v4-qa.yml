name: v4 preview QA

on:
  push:
    branches: [v4-system]
    paths:
      - 'v4/**'
      - '.github/workflows/v4-qa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'v4/**'
      - '.github/workflows/v4-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate preview invariants
        run: node v4/qa/validate-preview.mjs
      - name: Validate preview assets
        run: |
          test -f v4/prototype/index.html
          test -f v4/prototype/styles.css
          test -f v4/prototype/app.js
          grep -q "Perspective Lenses" v4/README.md
      - name: Install browser QA runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run desktop and mobile browser smoke QA
        run: node v4/qa/browser-smoke.mjs
      - name: Upload preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-preview-${{ github.sha }}
          path: v4/qa/artifacts/*.png
          if-no-files-found: warn
          retention-days: 14
